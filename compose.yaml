name: import-control-tower

services:
  db:
    image: postgres:18-alpine
    container_name: ict-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ict_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ict_password}
      POSTGRES_DB: ${POSTGRES_DB:-import_control_tower}
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-ict_user} -d $${POSTGRES_DB:-import_control_tower}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ict-network

  minio:
    image: quay.io/minio/minio:latest
    container_name: ict-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-minio_admin}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-minio_password123}
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ict-network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ict-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${POSTGRES_DB:-import_control_tower};Username=${POSTGRES_USER:-ict_user};Password=${POSTGRES_PASSWORD:-ict_password}"
      JWT_SECRET: ${JWT_SECRET:-DefaultSuperSecretKeyThatIsAtLeast32BytesLongForHS256Algorithm2026!}
      REFRESH_TOKEN_PEPPER: ${REFRESH_TOKEN_PEPPER:-DefaultSecretPepperKey2026!}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@controltower.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-AdminSecurePassword123!}
      SEED_ADMIN_FULL_NAME: ${SEED_ADMIN_FULL_NAME:-Initial System Administrator}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      FINANCIAL_MODULE_ENABLED: ${FINANCIAL_MODULE_ENABLED:-false}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-S3}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-http://minio:9000}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-import-control-tower-documents}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-minio_admin}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-minio_password123}
      STORAGE_FORCE_PATH_STYLE: ${STORAGE_FORCE_PATH_STYLE:-true}
      STORAGE_SIGNED_URL_LIFETIME_MINUTES: ${STORAGE_SIGNED_URL_LIFETIME_MINUTES:-15}
      STORAGE_MAX_UPLOAD_MB: ${STORAGE_MAX_UPLOAD_MB:-25}
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      ict-network:
        aliases:
          - api
          - import-control-tower-api-internal

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: ict-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - ict-network

  api-tests:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: build
    working_dir: /src
    command: dotnet test apps/api/ImportControlTower.sln --no-restore --verbosity normal
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ict-network

  web-tests:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: build
    working_dir: /app
    command: npm run test
    networks:
      - ict-network

volumes:
  postgres_data:
    name: ict_postgres_data
  minio_data:
    name: ict_minio_data

networks:
  ict-network:
    name: ict-network
    driver: bridge
