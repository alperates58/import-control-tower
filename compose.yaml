name: import-control-tower

services:
  db:
    image: postgres:18-alpine
    container_name: ict-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ict_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ict_password}
      POSTGRES_DB: ${POSTGRES_DB:-import_control_tower}
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-ict_user} -d $${POSTGRES_DB:-import_control_tower}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ict-network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ict-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${POSTGRES_DB:-import_control_tower};Username=${POSTGRES_USER:-ict_user};Password=${POSTGRES_PASSWORD:-ict_password}"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - ict-network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: ict-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - ict-network

volumes:
  postgres_data:
    name: ict_postgres_data

networks:
  ict-network:
    name: ict-network
    driver: bridge
